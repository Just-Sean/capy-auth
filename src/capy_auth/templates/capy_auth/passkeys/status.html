{% load i18n %}
{% comment %}
  Next to a passkey button: the notice for browsers without JavaScript, and the line
  where passkeys.js says what's happening (role="status", so screen readers announce
  it). The messages live here so they can be translated.
{% endcomment %}
<noscript>
    <p>{% translate "Passkeys and security keys need JavaScript, which is off in this browser." %}</p>
</noscript>
<p id="capy_auth_passkey_status"
   role="status"
   data-working="{% translate 'Follow the steps on your device.' %}"
   data-failed="{% translate 'That didn’t work: it was cancelled, or this device has no passkey or security key for this site. Try again, or use another way.' %}"
   data-unsupported="{% translate 'This browser can’t use passkeys or security keys.' %}"></p>
