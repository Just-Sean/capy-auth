{% load allauth %}
<section class="card border border-base-300">
    <div class="card-body">
        <h2 class="card-title">
            {% slot title %}
            {% endslot %}
        </h2>
        {% slot body %}
        {% endslot %}
        {% if slots.actions %}
            <div class="card-actions">
                {% for action in slots.actions %}{{ action }}{% endfor %}
            </div>
        {% endif %}
    </div>
</section>
